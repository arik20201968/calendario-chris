<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendario de Eventos — Calendario Chris</title>
<style>
  :root{
    --bg:#f8fafc;
    --card:#ffffff;
    --ink:#0f172a;
    --muted:#64748b;
    --accent:#4f46e5;
    --accent-soft:#eef2ff;
    --line:#e2e8f0;
    --ok:#059669;
    --warn:#dc2626;
    --amber:#d97706;
    --shadow:0 1px 3px rgba(15,23,42,.06), 0 1px 2px rgba(15,23,42,.04);
    --radius:12px;
    --radius-sm:8px;
    --tap:44px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.45;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  .app{max-width:1100px;margin:0 auto;padding:12px;padding-bottom:env(safe-area-inset-bottom, 16px);}

  /* Header */
  header{
    background:linear-gradient(135deg,#4f46e5 0%,#6366f1 100%);
    color:#fff;
    border-radius:var(--radius);
    padding:14px 16px;
    margin-bottom:12px;
    box-shadow:0 4px 12px rgba(79,70,229,.25);
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{font-size:1.1rem;margin:0;font-weight:700;letter-spacing:-.02em;}
  header .sub{opacity:.85;font-size:.75rem;margin-top:2px;}
  .today-btn{
    background:#fff;color:var(--accent);border:none;
    padding:8px 14px;border-radius:var(--radius-sm);font-size:.8rem;font-weight:600;
    cursor:pointer;min-height:var(--tap);white-space:nowrap;
  }
  .today-btn:hover{background:#f1f5f9;}
  .month-nav{display:flex;align-items:center;gap:6px;margin-top:10px;}
  .month-nav button{
    background:rgba(255,255,255,.15);
    color:#fff;border:1px solid rgba(255,255,255,.25);
    padding:8px 14px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;
    cursor:pointer;min-height:var(--tap);min-width:var(--tap);
    transition:background .15s;
  }
  .month-nav button:hover{background:rgba(255,255,255,.25);}
  .month-nav button:disabled{opacity:.35;cursor:not-allowed;}
  .month-label{font-size:.95rem;font-weight:700;flex:1;text-align:center;}
  .toolbar{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .toolbar button{
    background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.2);
    padding:8px 10px;border-radius:6px;font-size:.75rem;cursor:pointer;
    min-height:var(--tap);
  }
  .toolbar button:hover{background:rgba(255,255,255,.22);}

  /* Calendar grid */
  .cal-header{
    display:grid;gap:4px;margin-bottom:4px;
  }
  .cal-header div{
    text-align:center;font-size:.65rem;font-weight:700;color:var(--muted);
    text-transform:uppercase;letter-spacing:.04em;padding:4px 2px;
  }
  .cal-grid{
    display:grid;gap:4px;
  }
  .day{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);
    padding:6px;display:flex;flex-direction:column;
    box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s;
    position:relative;min-height:70px;
  }
  .day:active{transform:scale(.98);}
  .day.other-month{opacity:.3;background:#fafafa;}
  .day.today{border:2px solid var(--accent);}
  .day-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:2px;gap:2px;
  }
  .day-num{
    font-size:.8rem;font-weight:700;color:var(--ink);
    width:24px;height:24px;display:flex;align-items:center;justify-content:center;
    border-radius:50%;flex-shrink:0;
  }
  .day.today .day-num{background:var(--accent);color:#fff;}
  .day-add{
    width:var(--tap);height:var(--tap);border:none;background:transparent;color:var(--muted);
    font-size:1.3rem;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;
    transition:background .15s,color .15s;flex-shrink:0;
  }
  .day-add:hover{background:var(--accent-soft);color:var(--accent);}
  .events{display:flex;flex-direction:column;gap:2px;flex:1;}
  .event{
    font-size:.65rem;padding:3px 5px;border-radius:4px;
    background:var(--accent-soft);color:var(--accent);
    border-left:3px solid var(--accent);
    cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-weight:600;transition:background .15s;
    line-height:1.3;
  }
  .event:hover{background:#dde4ff;}
  .event.done{background:#d1fae5;color:var(--ok);border-left-color:var(--ok);}
  .event.skipped{background:#f1f5f9;color:#94a3b8;border-left-color:#94a3b8;text-decoration:line-through;}
  .event-time{font-size:.6rem;opacity:.8;font-weight:500;}
  .day-more{
    font-size:.65rem;color:var(--accent);cursor:pointer;padding:2px 0;
    font-weight:600;
  }
  .day-more:hover{text-decoration:underline;}

  /* Modal */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(15,23,42,.5);
    display:flex;align-items:flex-end;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .2s ease;
    padding:0;
    -webkit-tap-highlight-color:transparent;
  }
  @media(min-width:640px){
    .modal-backdrop{align-items:center;padding:20px;}
  }
  .modal-backdrop.open{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--card);border-radius:16px 16px 0 0;
    box-shadow:0 -4px 24px rgba(15,23,42,.2);
    width:100%;max-width:440px;padding:20px;
    transform:translateY(20px);transition:transform .25s ease;
    max-height:85vh;max-height:85dvh;overflow-y:auto;
  }
  @media(min-width:640px){
    .modal{border-radius:var(--radius);transform:translateY(8px);}
  }
  .modal-backdrop.open .modal{transform:translateY(0);}
  .modal h2{margin:0 0 2px;font-size:1.1rem;font-weight:700;}
  .modal .modal-sub{color:var(--muted);font-size:.8rem;margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:.72rem;font-weight:700;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em;}
  .field input,.field select,.field textarea{
    width:100%;padding:12px;border:1px solid var(--line);border-radius:var(--radius-sm);
    font-size:1rem;font-family:inherit;color:var(--ink);background:#fff;
    transition:border-color .15s,box-shadow .15s;
    min-height:var(--tap);
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,70,229,.12);
  }
  .field textarea{resize:vertical;min-height:80px;}
  .conflict-hint{font-size:.8rem;margin-top:6px;min-height:16px;}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap;}
  .btn{
    background:var(--accent);color:#fff;border:none;
    padding:10px 18px;border-radius:var(--radius-sm);font-size:.9rem;font-weight:600;
    cursor:pointer;min-height:var(--tap);transition:background .15s;
  }
  .btn:hover{background:#4338ca;}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{background:#f1f5f9;}
  .btn-sm{padding:6px 10px;font-size:.8rem;min-height:36px;}

  /* Events list inside modal */
  .day-events-list{display:flex;flex-direction:column;gap:8px;margin:12px 0;}
  .day-event-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 12px;background:#f8fafc;border:1px solid var(--line);border-radius:6px;
    gap:8px;
  }
  .day-event-info{flex:1;min-width:0;}
  .day-event-title{font-size:.9rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .day-event-meta{font-size:.78rem;color:var(--muted);}
  .day-event-actions{display:flex;gap:6px;}
  .day-event-actions button{
    background:none;border:none;cursor:pointer;font-size:1rem;padding:6px 8px;
    border-radius:6px;min-height:var(--tap);min-width:var(--tap);
    display:flex;align-items:center;justify-content:center;
  }
  .day-event-actions button:hover{background:#e2e8f0;}

  /* Toast */
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:.85rem;
    opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:200;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
    max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* Scrollbar */
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px;}

  /* Desktop-ish: wider, less cramped */
  @media(min-width:768px){
    .app{padding:20px 24px 40px;}
    header{padding:18px 22px;}
    header h1{font-size:1.25rem;}
    .month-nav button{padding:8px 16px;font-size:.9rem;}
    .month-label{font-size:1.05rem;}
    .cal-grid{gap:6px;}
    .day{padding:8px;min-height:100px;}
    .day-num{width:28px;height:28px;font-size:.85rem;}
    .event{font-size:.72rem;padding:4px 6px;}
    .event-time{font-size:.68rem;}
  }
  @media(min-width:1024px){
    .cal-grid{gap:8px;}
    .day{min-height:120px;padding:10px;}
    .event{font-size:.76rem;}
  }

  /* Mobile small: 2 cols, ultra compact */
  @media(max-width:360px){
    .app{padding:8px;padding-bottom:env(safe-area-inset-bottom, 12px);}
    header{padding:12px 12px;}
    header h1{font-size:1rem;}
    .month-label{font-size:.85rem;min-width:120px;}
    .month-nav button{padding:6px 10px;font-size:.8rem;}
    .today-btn{padding:6px 10px;font-size:.75rem;}
    .toolbar button{font-size:.7rem;padding:6px 8px;}
    .cal-header div{font-size:.6rem;}
    .day{padding:4px;min-height:60px;border-radius:6px;}
    .day-num{width:20px;height:20px;font-size:.7rem;}
    .day-add{width:32px;height:32px;font-size:1rem;}
    .event{font-size:.6rem;padding:2px 4px;border-left-width:2px;}
    .event-time{font-size:.58rem;}
    .day-more{font-size:.62rem;}
    .modal{padding:16px;}
    .field input,.field select,.field textarea{padding:10px;font-size:.9rem;}
    .btn{padding:10px 14px;font-size:.85rem;}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="header-top">
      <div>
        <h1>📅 Calendario de Eventos</h1>
        <div class="sub">Calendario Chris — gestión de eventos las 24 horas</div>
      </div>
      <button class="today-btn" id="todayBtn">Hoy</button>
    </div>
    <div class="month-nav">
      <button id="prevMonth" aria-label="Mes anterior">←</button>
      <span class="month-label" id="monthLabel">—</span>
      <button id="nextMonth" aria-label="Mes siguiente">→</button>
    </div>
    <div class="toolbar">
      <button id="importBtn">📂 Importar</button>
      <button id="exportBtn">💾 Exportar</button>
      <button id="clearBtn">🗑 Limpiar</button>
    </div>
  </header>

  <div class="cal-header" id="calHeader">
    <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
  </div>
  <div class="cal-grid" id="calGrid"></div>
</div>

<!-- Modal -->
<div class="modal-backdrop" id="modal">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="modalTitle">Nuevo evento</h2>
    <div class="modal-sub" id="modalDate">—</div>

    <div class="field">
      <label for="evTitle">Título del evento</label>
      <input type="text" id="evTitle" placeholder="Ej: Actividad, reunión, etc." autocomplete="off">
    </div>
    <div class="field">
      <label for="evTime">Hora</label>
      <select id="evTime"></select>
    </div>
    <div class="field">
      <label for="evNote">Nota (opcional)</label>
      <textarea id="evNote" placeholder="Detalles adicionales..."></textarea>
    </div>
    <div class="conflict-hint" id="conflictHint"></div>

    <div class="modal-actions">
      <button class="btn-ghost btn" id="modalCancel">Cancelar</button>
      <button class="btn" id="modalSave">Guardar evento</button>
    </div>
  </div>
</div>

<!-- Day detail modal -->
<div class="modal-backdrop" id="dayModal">
  <div class="modal" role="dialog" aria-modal="true">
    <h2 id="dayModalTitle">Eventos del día</h2>
    <div class="modal-sub" id="dayModalDate">—</div>
    <div class="day-events-list" id="dayEventsList"></div>
    <div class="modal-actions">
      <button class="btn-ghost btn" id="dayModalClose">Cerrar</button>
      <button class="btn" id="dayModalAdd">+ Agregar evento</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "calendario_eventos_v1";
  let data = loadData();
  let viewYear, viewMonth;
  var today = new Date();
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();

  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.events)){
          let maxId = 0;
          parsed.events.forEach(function(e){ if(e.id > maxId) maxId = e.id; });
          parsed.nextId = (parsed.nextId || (maxId + 1));
          return parsed;
        }
      }
    }catch(e){}
    return { events: [], nextId: 1 };
  }

  function persist(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }catch(e){}
  }

  function dayKey(y,m,d){
    return y + "-" + String(m+1).padStart(2,"0") + "-" + String(d).padStart(2,"0");
  }

  function timeOptions(){
    var arr = [];
    for(var h=0;h<24;h++){
      for(var m=0;m<60;m+=30){
        arr.push(String(h).padStart(2,"0") + ":" + String(m).padStart(2,"0"));
      }
    }
    return arr;
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
  }

  function monthName(m){
    return ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"][m];
  }

  function getEventsForDate(key){
    return data.events.filter(function(e){ return e.date === key && !e.deleted; })
      .sort(function(a,b){ return a.time.localeCompare(b.time); });
  }

  function applyGridStyle(){
    var w = window.innerWidth;
    var grid = document.getElementById("calGrid");
    var header = document.getElementById("calHeader");
    if(w <= 360){
      grid.style.gridTemplateColumns = "repeat(2, 1fr)";
      header.style.gridTemplateColumns = "repeat(2, 1fr)";
    } else if(w <= 480){
      grid.style.gridTemplateColumns = "repeat(3, 1fr)";
      header.style.gridTemplateColumns = "repeat(3, 1fr)";
    } else if(w <= 640){
      grid.style.gridTemplateColumns = "repeat(4, 1fr)";
      header.style.gridTemplateColumns = "repeat(4, 1fr)";
    } else if(w <= 820){
      grid.style.gridTemplateColumns = "repeat(5, 1fr)";
      header.style.gridTemplateColumns = "repeat(5, 1fr)";
    } else {
      grid.style.gridTemplateColumns = "repeat(7, 1fr)";
      header.style.gridTemplateColumns = "repeat(7, 1fr)";
    }
  }

  function render(){
    var firstDay = new Date(viewYear, viewMonth, 1);
    var startWeekday = firstDay.getDay();
    var startOffset = startWeekday === 0 ? 6 : startWeekday - 1;
    var daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    var daysInPrev = new Date(viewYear, viewMonth, 0).getDate();

    $("#monthLabel").textContent = monthName(viewMonth) + " " + viewYear;

    applyGridStyle();

    var grid = $("#calGrid");
    grid.innerHTML = "";

    var totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;

    for(let i=0;i<totalCells;i++){
      let dayDiv = document.createElement("div");
      dayDiv.className = "day";

      let dateNum, cellMonth, cellYear, dateKey;
      if(i < startOffset){
        dateNum = daysInPrev - startOffset + i + 1;
        cellMonth = viewMonth - 1;
        cellYear = viewYear;
        if(cellMonth < 0){ cellMonth = 11; cellYear--; }
        dayDiv.classList.add("other-month");
      } else if(i >= startOffset + daysInMonth){
        dateNum = i - startOffset - daysInMonth + 1;
        cellMonth = viewMonth + 1;
        cellYear = viewYear;
        if(cellMonth > 11){ cellMonth = 0; cellYear++; }
        dayDiv.classList.add("other-month");
      } else {
        dateNum = i - startOffset + 1;
        cellMonth = viewMonth;
        cellYear = viewYear;
      }

      dateKey = dayKey(cellYear, cellMonth, dateNum);
      let isToday = (cellYear === today.getFullYear() && cellMonth === today.getMonth() && dateNum === today.getDate());
      if(isToday) dayDiv.classList.add("today");

      let events = getEventsForDate(dateKey);

      let header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML = "<span class=\"day-num\">" + dateNum + "</span>" +
        "<button class=\"day-add\" data-date=\"" + dateKey + "\" title=\"Agregar evento\" aria-label=\"Agregar evento\">+</button>";
      dayDiv.appendChild(header);

      let evContainer = document.createElement("div");
      evContainer.className = "events";

      let maxShow = window.innerWidth <= 360 ? 1 : 2;
      events.slice(0, maxShow).forEach(function(ev){
        let evDiv = document.createElement("div");
        evDiv.className = "event" + (ev.done ? " done" : "") + (ev.skipped ? " skipped" : "");
        evDiv.dataset.id = ev.id;
        evDiv.dataset.date = dateKey;
        evDiv.title = ev.title + (ev.note ? "\n" + ev.note : "");
        evDiv.innerHTML = "<div class=\"event-time\">" + ev.time + "</div>" + escapeHtml(ev.title);
        evDiv.addEventListener("click", function(e){
          e.stopPropagation();
          openDayModal(dateKey, cellYear, cellMonth, dateNum);
        });
        evContainer.appendChild(evDiv);
      });

      if(events.length > maxShow){
        let more = document.createElement("div");
        more.className = "day-more";
        more.textContent = "+" + (events.length - maxShow) + " más";
        more.addEventListener("click", function(e){
          e.stopPropagation();
          openDayModal(dateKey, cellYear, cellMonth, dateNum);
        });
        evContainer.appendChild(more);
      }

      dayDiv.appendChild(evContainer);
      dayDiv.addEventListener("click", function(e){
        if(e.target.closest(".event") || e.target.closest(".day-more") || e.target.closest(".day-add")) return;
        openDayModal(dateKey, cellYear, cellMonth, dateNum);
      });

      grid.appendChild(dayDiv);
    }

    var sel = $("#evTime");
    sel.innerHTML = timeOptions().map(function(t){
      return "<option value=\"" + t + "\">" + t + "</option>";
    }).join("");
  }

  var modalOpen = false;
  var editingId = null;
  var selectedDate = null;

  function openModal(dateKey, editId){
    modalOpen = true;
    editingId = editId || null;
    selectedDate = dateKey;
    var parts = dateKey.split("-");
    var d = new Date(parts[0], parts[1]-1, parts[2]);
    $("#modalDate").textContent = d.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    $("#modalTitle").textContent = editingId ? "Editar evento" : "Nuevo evento";
    $("#evTitle").value = "";
    $("#evTime").value = "10:00";
    $("#evNote").value = "";
    $("#conflictHint").textContent = "";
    $("#modal").classList.add("open");
    setTimeout(function(){ $("#evTitle").focus(); }, 100);
    validateForm();
  }

  function closeModal(){
    $("#modal").classList.remove("open");
    modalOpen = false;
    editingId = null;
    selectedDate = null;
  }

  function validateForm(){
    var title = $("#evTitle").value.trim();
    var time = $("#evTime").value;
    var hint = $("#conflictHint");
    if(!title){
      hint.textContent = "Ingresa un título para el evento";
      hint.style.color = "var(--muted)";
    } else {
      var conflicts = data.events.filter(function(e){
        return e.date === selectedDate && e.time === time && e.id !== editingId && !e.deleted;
      });
      if(conflicts.length > 0){
        hint.textContent = "⚠ Ya existe: " + conflicts[0].title + " a las " + time;
        hint.style.color = "var(--warn)";
      } else {
        hint.textContent = "✓ Horario disponible";
        hint.style.color = "var(--ok)";
      }
    }
  }

  function saveEvent(){
    var title = $("#evTitle").value.trim();
    var time = $("#evTime").value;
    var note = $("#evNote").value.trim();
    if(!title){
      $("#evTitle").focus();
      $("#evTitle").style.borderColor = "var(--warn)";
      setTimeout(function(){ $("#evTitle").style.borderColor = ""; }, 1000);
      return;
    }
    if(editingId){
      var ev = data.events.find(function(e){ return e.id === editingId; });
      if(ev){ ev.title = title; ev.time = time; ev.note = note; }
    } else {
      data.events.push({
        id: data.nextId++,
        date: selectedDate,
        time: time,
        title: title,
        note: note,
        done: false,
        skipped: false,
        created: new Date().toISOString(),
        deleted: false
      });
    }
    persist();
    closeModal();
    render();
    toast(editingId ? "Evento actualizado" : "Evento guardado");
  }

  function deleteEvent(id){
    var ev = data.events.find(function(e){ return e.id === id; });
    if(!ev) return;
    if(!confirm("¿Eliminar el evento \"" + ev.title + "\"?")) return;
    ev.deleted = true;
    data.events = data.events.filter(function(e){ return e.id !== id; });
    persist();
    render();
    toast("Evento eliminado");
  }

  function toggleDone(id){
    var ev = data.events.find(function(e){ return e.id === id; });
    if(!ev) return;
    ev.done = !ev.done;
    if(ev.done) ev.skipped = false;
    persist();
    render();
  }

  function toggleSkip(id){
    var ev = data.events.find(function(e){ return e.id === id; });
    if(!ev) return;
    ev.skipped = !ev.skipped;
    if(ev.skipped) ev.done = false;
    persist();
    render();
  }

  function toast(msg){
    var el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ el.classList.remove("show"); }, 1800);
  }

  function openDayModal(dateKey, y, m, d){
    var dayDate = new Date(y, m, d);
    $("#dayModalDate").textContent = dayDate.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
    $("#dayModalTitle").textContent = "Eventos del día";
    var list = $("#dayEventsList");
    list.innerHTML = "";
    var events = getEventsForDate(dateKey);
    if(events.length === 0){
      list.innerHTML = "<div style='text-align:center;color:var(--muted);padding:20px;font-size:.85rem;'>Sin eventos este día</div>";
    } else {
      events.forEach(function(ev){
        var item = document.createElement("div");
        item.className = "day-event-item";
        item.innerHTML =
          "<div class=\"day-event-info\">" +
            "<div class=\"day-event-title\">" + escapeHtml(ev.title) + (ev.done ? " ✓" : "") + (ev.skipped ? " ✕" : "") + "</div>" +
            "<div class=\"day-event-meta\">" + ev.time + (ev.note ? " · " + escapeHtml(ev.note) : "") + "</div>" +
          "</div>" +
          "<div class=\"day-event-actions\">" +
            "<button title=\"Marcar realizada\" data-act=\"done\">✓</button>" +
            "<button title=\"Marcar suspendida\" data-act=\"skip\">✕</button>" +
            "<button title=\"Editar\" data-act=\"edit\">✎</button>" +
            "<button title=\"Eliminar\" data-act=\"del\" style=\"color:var(--warn)\">🗑</button>" +
          "</div>";
        item.querySelectorAll("button[data-act]").forEach(function(btn){
          btn.addEventListener("click", function(e){
            e.stopPropagation();
            var act = btn.dataset.act;
            if(act === "done") toggleDone(ev.id);
            else if(act === "skip") toggleSkip(ev.id);
            else if(act === "edit"){ $("#dayModal").classList.remove("open"); openModal(dateKey, ev.id); }
            else if(act === "del"){ $("#dayModal").classList.remove("open"); deleteEvent(ev.id); }
          });
        });
        list.appendChild(item);
      });
    }
    $("#dayModal").dataset.dateKey = dateKey;
    $("#dayModal").classList.add("open");
  }

  function closeDayModal(){
    $("#dayModal").classList.remove("open");
  }

  // Events
  $("#prevMonth").addEventListener("click", function(){
    viewMonth--;
    if(viewMonth < 0){ viewMonth = 11; viewYear--; }
    render();
  });
  $("#nextMonth").addEventListener("click", function(){
    viewMonth++;
    if(viewMonth > 11){ viewMonth = 0; viewYear++; }
    render();
  });
  $("#todayBtn").addEventListener("click", function(){
    viewYear = today.getFullYear(); viewMonth = today.getMonth();
    render();
  });

  $("#modalCancel").addEventListener("click", closeModal);
  $("#modalSave").addEventListener("click", saveEvent);
  $("#modal").addEventListener("click", function(e){ if(e.target === $("#modal")) closeModal(); });
  $("#dayModalClose").addEventListener("click", closeDayModal);
  $("#dayModal").addEventListener("click", function(e){ if(e.target === $("#dayModal")) closeDayModal(); });
  $("#dayModalAdd").addEventListener("click", function(){
    var dk = $("#dayModal").dataset.dateKey;
    closeDayModal();
    setTimeout(function(){ openModal(dk); }, 200);
  });

  $("#evTitle").addEventListener("input", validateForm);
  $("#evTime").addEventListener("change", validateForm);

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape"){
      if(modalOpen) closeModal();
      else if($("#dayModal").classList.contains("open")) closeDayModal();
    }
  });

  $("#calGrid").addEventListener("click", function(e){
    var addBtn = e.target.closest(".day-add");
    if(addBtn){
      openModal(addBtn.dataset.date);
    }
  });

  $("#exportBtn").addEventListener("click", function(){
    var blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "calendario_eventos_" + new Date().toISOString().slice(0,10) + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    toast("Calendario exportado");
  });

  $("#importBtn").addEventListener("click", function(){
    var input = document.createElement("input");
    input.type = "file";
    input.accept = ".json";
    input.onchange = function(e){
      var file = e.target.files[0]; if(!file) return;
      var reader = new FileReader();
      reader.onload = function(ev){
        try{
          var imported = JSON.parse(ev.target.result);
          if(!imported || !Array.isArray(imported.events)){ alert("Formato inválido."); return; }
          if(!confirm("Importar " + imported.events.length + " eventos. Reemplazará los datos actuales.")) return;
          data = imported;
          var maxId = 0;
          data.events.forEach(function(e){ if(e.id > maxId) maxId = e.id; });
          data.nextId = Math.max(data.nextId || (maxId+1), maxId+1);
          persist(); render(); toast("Importación completada");
        }catch(err){ alert("No se pudo leer el archivo."); }
      };
      reader.readAsText(file);
    };
    input.click();
  });

  $("#clearBtn").addEventListener("click", function(){
    if(!confirm("¿Borrar TODOS los eventos? Esta acción no se puede deshacer.")) return;
    if(!confirm("¿Estás seguro?")) return;
    data = { events: [], nextId: 1 };
    persist(); render();
    toast("Todo borrado");
  });

  window.addEventListener("resize", function(){
    applyGridStyle();
  });

  render();
})();
</script>
</body>
</html>
